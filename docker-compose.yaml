services:
  order_flow_backend:
    build: .
    env_file:
      - app/.env
    ports: [ "8080:8000" ]
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.scripts.seed_manager && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  postgres:
    image: postgres:18-alpine
    env_file:
      - app/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
